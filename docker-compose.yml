version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - frontend
    env_file:
      - backend/.env